<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Berlin Marathon">
<title>Berlin Marathon Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#eeede8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#639922;--green-bg:#EAF3DE;--green-text:#27500A;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --red:#D85A30;--red-bg:#FAECE7;--red-text:#993C1D;
  --r:10px;--rs:7px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  --blue-bg:#0c2340;--blue-text:#85B7EB;
  --green-bg:#1a2e0a;--green-text:#97C459;
  --amber-bg:#2a1f05;--amber-text:#EF9F27;
  --red-bg:#2a1005;--red-text:#F0997B;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding-bottom:80px;}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100;}
.topbar h1{font-size:18px;font-weight:600;}
.topbar p{font-size:12px;color:var(--text2);margin-top:2px;}
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nb{flex:1;padding:10px 4px 8px;border:none;background:transparent;font-size:10px;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;}
.nb.active{color:var(--blue);}
.nb svg{width:22px;height:22px;}
.screen{display:none;padding:16px;}
.screen.active{display:block;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.ch{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;user-select:none;}
.cb{border-top:0.5px solid var(--border);}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.sc{background:var(--bg2);border-radius:var(--rs);padding:11px 13px;}
.sc .sl{font-size:11px;color:var(--text2);margin-bottom:3px;}
.sc .sv{font-size:21px;font-weight:600;}
.sc .ss{font-size:11px;color:var(--text3);margin-top:1px;}
.wr{padding:11px 14px;display:flex;align-items:flex-start;gap:10px;border-bottom:0.5px solid var(--border);}
.wr:last-child{border-bottom:none;}
.ck{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.ck.done{background:var(--green);border-color:var(--green);}
.ck svg{display:none;width:13px;height:13px;}
.ck.done svg{display:block;}
.wi{flex:1;min-width:0;}
.wn{font-size:14px;font-weight:500;}
.wd{font-size:12px;margin-top:2px;}
.tl{color:var(--blue-text);}
.tt{color:var(--amber-text);}
.te{color:var(--green-text);}
.tg{color:var(--text2);}
.tr{color:var(--red-text);}
.ls{font-size:12px;color:var(--text2);margin-top:5px;padding:5px 8px;background:var(--bg2);border-radius:var(--rs);}
.lf{margin-top:7px;display:flex;flex-direction:column;gap:5px;}
.lr{display:flex;gap:5px;}
.inp{flex:1;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--rs);background:var(--bg2);color:var(--text);font-family:inherit;min-width:0;}
.inp::placeholder{color:var(--text3);}
.ins{width:80px;min-width:0;}
.bs{font-size:13px;padding:7px 12px;border:0.5px solid var(--border2);border-radius:var(--rs);background:transparent;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.bs:active{background:var(--bg2);}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.bd{background:var(--green-bg);color:var(--green-text);}
.bp{background:var(--amber-bg);color:var(--amber-text);}
.bc{background:var(--blue-bg);color:var(--blue-text);}
.bo{background:var(--bg2);color:var(--text2);}
.pp{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-right:5px;}
.p1{background:var(--blue-bg);color:var(--blue-text);}
.p2{background:var(--green-bg);color:var(--green-text);}
.p3{background:var(--amber-bg);color:var(--amber-text);}
.p4{background:var(--red-bg);color:var(--red-text);}
.pb{height:4px;background:var(--bg3);border-radius:2px;margin-top:5px;}
.pf{height:4px;background:var(--blue);border-radius:2px;}
.stl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;}
.mr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border);}
.mr:last-child{border-bottom:none;}
.md{width:10px;height:10px;min-width:10px;border-radius:50%;}
.m1{background:var(--green);}
.m2{background:var(--blue);}
.m3{background:var(--bg3);}
.hz{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0;}
.hz > div{border-radius:var(--rs);padding:6px 4px;text-align:center;}
.hz > div .hn{font-size:10px;font-weight:600;margin-bottom:2px;}
.hz > div .hr2{font-size:9px;opacity:.8;}
.hz1{background:#E6F1FB;color:#0C447C;}
.hz2{background:#EAF3DE;color:#27500A;}
.hz3{background:#FAEEDA;color:#633806;}
.hz4{background:#FAECE7;color:#993C1D;}
.hz5{background:#FCEBEB;color:#791F1F;}
.cw{display:flex;align-items:flex-end;gap:3px;height:80px;margin:8px 0 4px;}
.bc2{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bf{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bl{font-size:9px;color:var(--text3);}
.empty{text-align:center;padding:24px 16px;color:var(--text3);font-size:13px;}
.abtns{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.abtn{font-size:11px;padding:4px 9px;border:0.5px solid var(--border2);border-radius:var(--rs);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;}
.abtn:active{background:var(--bg2);}
.abtn.active-ausfall{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-text);}
</style>
</head>

function save() {

function load() {
  try { state = JSON.parse(localStorage.getItem('bm-state') || '{}'); } catch(e) { state = {}; }

function getCurrentKw() {
  var start = new Date('2026-04-05');
  var now = new Date();
  var diff = Math.floor((now - start) / (7*24*3600*1000));
  return Math.max(1, Math.min(25, diff + 1));
}

function typeLabel(t) {
  var map = {long:'Langer Lauf', tempo:'Tempo/Intervall', easy:'Easy Run', gym:'Gym', race:'Wettkampf'};
  return map[t] || t;
}
function typeCls(t) {
  var map = {long:'tl', tempo:'tt', easy:'te', gym:'tg', race:'tr'};
  return map[t] || '';
}
function phaseName(p) { return ['','Basis','Aufbau','Peak','Tapering'][p] || ''; }
function phaseCls(p) { return ['','p1','p2','p3','p4'][p] || 'p1'; }
function doneCount(week) {
  var n = 0;
  for(var i=0; i<week.workouts.length; i++) { if(state[week.workouts[i].id]) n++; }
  return n;
}
function checkSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';

function fmtPace(secs) {
  var m = Math.floor(secs/60);
  var s = Math.round(secs % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function workoutRow(w, prefix) {
  var done = !!state[w.id];
  var lg = logs[w.id] || {};
  var saved = '';
  if(lg.dist || lg.pace || lg.hr || lg.hrmax) {
    var parts = [];
    if(lg.dist) parts.push(lg.dist + ' km');
    if(lg.pace) parts.push(lg.pace + '/km');
    if(lg.hr) parts.push('O-Puls ' + lg.hr + ' bpm');
    if(lg.hrmax) parts.push('Max ' + lg.hrmax + ' bpm');
    if(lg.feel) parts.push(lg.feel);
    saved = '<div class="ls">' + parts.join(' &middot; ') + (lg.note ? ' &middot; ' + lg.note : '') + '</div>';
  } else if(lg.note) {
    saved = '<div class="ls">' + lg.note + '</div>';
  }
  var form = '';
  if(w.type !== 'gym') {
    form = '<div class="lf">'
      + '<div class="lr">'
      + '<input class="inp" id="' + prefix + 'dist-' + w.id + '" type="number" placeholder="km" step="0.1" value="' + (lg.dist||'') + '">'
      + '<input class="inp" id="' + prefix + 'pace-' + w.id + '" type="text" placeholder="Pace 5:41" value="' + (lg.pace||'') + '">'
      + '</div>'
      + '<div class="lr">'
      + '<input class="inp ins" id="' + prefix + 'hr-' + w.id + '" type="number" placeholder="Oe Puls" value="' + (lg.hr||'') + '">'
      + '<input class="inp ins" id="' + prefix + 'hrmax-' + w.id + '" type="number" placeholder="Max Puls" value="' + (lg.hrmax||'') + '">'
      + '<select class="inp" id="' + prefix + 'feel-' + w.id + '">'
      + '<option value="">Gefuehl...</option>'
      + '<option value="super"' + (lg.feel==='super'?' selected':'') + '>Super</option>'
      + '<option value="gut"' + (lg.feel==='gut'?' selected':'') + '>Gut</option>'
      + '<option value="okay"' + (lg.feel==='okay'?' selected':'') + '>Okay</option>'
      + '<option value="schwer"' + (lg.feel==='schwer'?' selected':'') + '>Schwer</option>'
      + '</select>'
      + '</div>'
      + '<div class="lr">'
      + '<input class="inp" id="' + prefix + 'note-' + w.id + '" type="text" placeholder="Notiz..." value="' + (lg.note||'') + '">'
      + '<button class="bs" onclick="saveLog(\'' + w.id + '\',\'' + prefix + '\')">Speichern</button>'
      + '</div>'
      + '</div>';
  }
  return '<div class="wr">'
    + '<button class="ck' + (done?' done':'') + '" onclick="toggle(\'' + w.id + '\')">' + (done?checkSvg():'') + '</button>'
    + '<div class="wi">'
    + '<div class="wn">' + w.name + '</div>'
    + '<div class="wd ' + typeCls(w.type) + '">' + typeLabel(w.type) + (w.desc ? ' &mdash; ' + w.desc : '') + '</div>'
    + saved + form
    + '</div></div>';
}

function toggle(id) {
  state[id] = !state[id];
  save();
  render();
}

function saveLog(id, prefix) {
  function g(k) { var el = document.getElementById(prefix + k + '-' + id); return el ? el.value : ''; }
  logs[id] = {dist:g('dist'), pace:g('pace'), hr:g('hr'), hrmax:g('hrmax'), feel:g('feel'), note:g('note')};
  save();
  render();
}

function markAusfall(kw, reason) {
  if(reason) { ausfallWeeks[kw] = reason; } else { delete ausfallWeeks[kw]; }
  save();
  render();
}

function renderHeute() {
  var kw = getCurrentKw();
  var week = null;
  for(var i=0; i<PLAN.length; i++) { if(PLAN[i].kw === kw) { week = PLAN[i]; break; } }
  if(!week) week = PLAN[0];

  var totalDone = 0;
  var totalAll = 0;
  for(var i=0; i<PLAN.length; i++) {
    totalAll += PLAN[i].workouts.length;
    totalDone += doneCount(PLAN[i]);
  }
  var weeksDone = 0;
  for(var i=0; i<PLAN.length; i++) {
    if(PLAN[i].kw < kw && doneCount(PLAN[i]) === PLAN[i].workouts.length) weeksDone++;
  }
  var pct = Math.round(totalDone/totalAll*100);
  var weeksLeft = 25 - kw + 1;

  var h = '<div class="sg">'
    + '<div class="sc"><div class="sl">Aktuelle Woche</div><div class="sv">KW ' + week.kw + '/25</div><div class="ss">' + week.datum + ' &middot; ' + phaseName(week.phase) + '</div></div>'
    + '<div class="sc"><div class="sl">Fortschritt</div><div class="sv">' + pct + '%</div><div class="ss">' + totalDone + ' von ' + totalAll + ' Einheiten</div></div>'
    + '<div class="sc"><div class="sl">Bis Berlin</div><div class="sv">' + weeksLeft + ' Wo.</div><div class="ss">27. September 2026</div></div>'
    + '<div class="sc"><div class="sl">Wochen fertig</div><div class="sv">' + weeksDone + '</div><div class="ss">von 25</div></div>'
    + '</div>';

  // Weekly km
  var planKm = 0, actualKm = 0;
  for(var i=0; i<week.workouts.length; i++) {
    var w = week.workouts[i];
    if(w.type === 'gym') continue;
    var m = w.name.match(/(\d+[.,]?\d*)\s*km/i);
    if(m) planKm += parseFloat(m[1].replace(',','.'));
    var lg = logs[w.id] || {};
    if(lg.dist) actualKm += parseFloat(lg.dist) || 0;
  }
  if(planKm > 0) {
    var kmPct = Math.min(100, Math.round(actualKm/planKm*100));
    var kmColor = kmPct >= 100 ? 'var(--green)' : 'var(--blue)';
    h += '<div class="stl">Wochenkilometer</div>'
      + '<div class="card"><div class="cb" style="padding:12px 14px;">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">'
      + '<span style="font-size:22px;font-weight:600;">' + actualKm.toFixed(1) + ' km</span>'
      + '<span style="font-size:13px;color:var(--text2);align-self:flex-end;">Plan: ' + planKm + ' km</span>'
      + '</div>'
      + '<div class="pb"><div class="pf" style="width:' + kmPct + '%;background:' + kmColor + '"></div></div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:4px;">' + kmPct + '% des Wochenziels</div>'
      + '</div></div>';
  }

  h += '<div class="stl">Diese Woche &mdash; <span class="pp ' + phaseCls(week.phase) + '">' + phaseName(week.phase) + '</span></div>';
  h += '<div class="card"><div class="cb">';
  for(var i=0; i<week.workouts.length; i++) { h += workoutRow(week.workouts[i], 'h-'); }
  h += '</div></div>';

  h += '<div class="stl">Meilensteine</div><div class="card"><div class="cb" style="padding:0 14px;">';
  for(var i=0; i<MILESTONES.length; i++) {
    var ms = MILESTONES[i];
    var cls = ms.kw < kw ? 'm1' : ms.kw === kw ? 'm2' : 'm3';
    var lbl = ms.kw < kw ? 'Erreicht' : ms.kw === kw ? 'Diese Woche' : 'KW ' + ms.kw;
    h += '<div class="mr"><div class="md ' + cls + '"></div><div style="flex:1;font-size:13px;">' + ms.text + '</div><div style="font-size:11px;color:var(--text2);">' + lbl + '</div></div>';
  }
  h += '</div></div>';
  document.getElementById('s-heute').innerHTML = h;
}

function renderPlan() {
  var kw = getCurrentKw();
  var h = '';
  for(var i=0; i<PLAN.length; i++) {
    var week = PLAN[i];
    var isOpen = !!openWeeks[week.kw];
    var done = doneCount(week);
    var total = week.workouts.length;
    var pct = total ? Math.round(done/total*100) : 0;
    var ausfall = ausfallWeeks[week.kw] || '';
    var badgeCls = 'bo', badgeText = 'ab ' + week.datum;
    if(ausfall) { badgeCls = 'bp'; badgeText = ausfall; }
    else if(week.kw === kw) { badgeCls = 'bc'; badgeText = 'diese Woche'; }
    else if(week.kw < kw) { badgeCls = done===total ? 'bd' : 'bp'; badgeText = done + '/' + total; }

    h += '<div class="card">'
      + '<div class="ch" onclick="toggleWeek(' + week.kw + ')">'
      + '<div style="flex:1;min-width:0;">'
      + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
      + '<span class="pp ' + phaseCls(week.phase) + '">' + phaseName(week.phase) + '</span>'
      + '<span style="font-size:14px;font-weight:500;">KW ' + week.kw + ' &mdash; ' + week.datum + '</span>'
      + '</div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:2px;">' + done + '/' + total + ' Einheiten</div>'
      + '<div class="pb"><div class="pf" style="width:' + pct + '%"></div></div>'
      + '</div>'
      + '<span class="badge ' + badgeCls + '" style="margin-left:8px;">' + badgeText + '</span>'
      + '</div>';

    // Ausfall buttons for past+current weeks
    if(week.kw <= kw) {
      h += '<div class="abtns" style="padding:0 14px 10px;" onclick="event.stopPropagation()">';
      var reasons = ['krank','verletzt','urlaub'];
      for(var r=0; r<reasons.length; r++) {
        var reason = reasons[r];
        var isCurrent = ausfall === reason;
        h += '<button class="abtn' + (isCurrent?' active-ausfall':'') + '" onclick="markAusfall(' + week.kw + ',\'' + reason + '\')">' + reason.charAt(0).toUpperCase() + reason.slice(1) + '</button>';
      }
      if(ausfall) {
        h += '<button class="abtn" style="color:var(--green-text);" onclick="markAusfall(' + week.kw + ',\'\')">Zuruecksetzen</button>';
      }
      h += '</div>';
    }

    if(isOpen) {
      h += '<div class="cb">';
      for(var j=0; j<week.workouts.length; j++) { h += workoutRow(week.workouts[j], 'p-'); }
      h += '</div>';
    }
    h += '</div>';
  }
  document.getElementById('s-plan').innerHTML = h;
}

function renderPuls() {
  var h = '<div class="stl">Pace-Rechner</div>'
    + '<div class="card"><div class="cb" style="padding:12px 14px;">'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:10px;">Zielzeit eingeben &rarr; alle Trainings-Paces werden berechnet.</div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">'
    + '<input class="inp" type="text" id="goal-time" placeholder="z.B. 3:55" style="width:90px;" oninput="calcPaces()" value="4:00">'
    + '<span style="font-size:13px;color:var(--text2);">Std:Min Zielzeit</span>'
    + '</div>'
    + '<div id="pace-results"></div>'
    + '</div></div>';

  h += '<div class="stl">Herzfrequenz-Zonen</div>'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:10px;">Basierend auf max. Puls. Kannst du anpassen.</div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'
    + '<input class="inp" type="number" id="hrmax-inp" value="185" style="width:80px;" oninput="updateZones()">'
    + '<span style="font-size:13px;color:var(--text2);">bpm Max-Puls</span>'
    + '</div>'
    + '<div class="hz" id="hr-zones-grid"></div>';

  h += '<div class="card" style="margin-top:4px;"><div class="cb" style="padding:12px 14px;">'
    + '<div style="font-size:13px;font-weight:500;margin-bottom:8px;">Zonen im Training</div>'
    + '<div style="font-size:13px;color:var(--text2);line-height:1.8;">'
    + 'Easy Run &amp; Langer Lauf &rarr; Zone 2 (60-70%)<br>'
    + 'Tempolauf &rarr; Zone 3-4 (70-85%)<br>'
    + 'Intervall &rarr; Zone 4-5 (85-95%)<br>'
    + 'Marathonrennen &rarr; Zone 3-4 (75-85%)'
    + '</div></div></div>';

  // HR chart
  var runs = [];
  for(var i=0; i<PLAN.length; i++) {
    for(var j=0; j<PLAN[i].workouts.length; j++) {
      var w = PLAN[i].workouts[j];
      if(w.type !== 'gym' && logs[w.id] && (logs[w.id].hr || logs[w.id].hrmax)) runs.push(w);
    }
  }
  h += '<div class="stl">Puls-Verlauf</div>';
  if(runs.length === 0) {
    h += '<div class="empty">Noch keine Pulsdaten eingetragen.</div>';
  } else {
    var recent = runs.slice(-10);
    var maxVal = 0;
    for(var i=0; i<recent.length; i++) {
      var v = parseInt(logs[recent[i].id].hrmax || logs[recent[i].id].hr || 0);
      if(v > maxVal) maxVal = v;
    }
    h += '<div class="card"><div class="cb" style="padding:12px 14px;"><div class="cw">';
    for(var i=0; i<recent.length; i++) {
      var lg = logs[recent[i].id];
      var hr = parseInt(lg.hr || 0);
      var hrmax = parseInt(lg.hrmax || hr);
      var hh = maxVal > 0 ? Math.round(hrmax/maxVal*72) : 2;
      var hh2 = maxVal > 0 ? Math.round(hr/maxVal*72) : 2;
      var col = hrmax > 165 ? '#E24B4A' : hrmax > 148 ? '#D85A30' : hrmax > 130 ? '#BA7517' : '#639922';
      h += '<div class="bc2">'
        + '<div class="bf" style="height:' + hh + 'px;background:' + col + ';opacity:.3;"></div>'
        + '<div class="bf" style="height:' + hh2 + 'px;background:' + col + ';margin-top:-' + hh + 'px;position:relative;"></div>'
        + '<div class="bl">' + recent[i].name.split(' ')[0].substring(0,5) + '</div>'
        + '</div>';
    }
    h += '</div>'
      + '<div style="display:flex;gap:12px;font-size:11px;color:var(--text2);margin-top:4px;">'
      + '<span><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:#639922;"></span> Z2</span>'
      + '<span><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:#BA7517;"></span> Z3</span>'
      + '<span><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:#E24B4A;"></span> Z4/5</span>'
      + '</div></div></div>';
  }

  document.getElementById('s-puls').innerHTML = h;
  updateZones();
  calcPaces();
}

function calcPaces() {
  var inp = document.getElementById('goal-time');
  var el = document.getElementById('pace-results');
  if(!inp || !el) return;
  var parts = inp.value.split(':');
  if(parts.length < 2) return;
  var totalMin = parseInt(parts[0]||0)*60 + parseInt(parts[1]||0);
  if(!totalMin || totalMin < 60) return;
  var raceSec = Math.round(totalMin * 60 / 42.195);
  var rows = [
    {label:'Marathontempo (Renntempo)', sec: raceSec},
    {label:'Langer Lauf (locker)', sec: Math.round(raceSec * 1.15)},
    {label:'Easy Run', sec: Math.round(raceSec * 1.20)},
    {label:'Tempolauf (Zone 3)', sec: Math.round(raceSec * 0.95)},
    {label:'Intervall (Zone 4)', sec: Math.round(raceSec * 0.88)}
  ];
  var html = '';
  for(var i=0; i<rows.length; i++) {
    var color = i===0 ? 'var(--amber-text)' : i<=2 ? 'var(--blue-text)' : 'var(--red-text)';
    html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border);">'
      + '<span style="font-size:13px;color:var(--text2);">' + rows[i].label + '</span>'
      + '<span style="font-size:14px;font-weight:600;color:' + color + ';">' + fmtPace(rows[i].sec) + '/km</span>'
      + '</div>';
  }
  el.innerHTML = html;
}

function updateZones() {
  var inp = document.getElementById('hrmax-inp');
  var grid = document.getElementById('hr-zones-grid');
  if(!inp || !grid) return;
  var hmax = parseInt(inp.value) || 185;
  var zones = [[0,0.60],[0.60,0.70],[0.70,0.80],[0.80,0.90],[0.90,1.01]];
  var cls = ['hz1','hz2','hz3','hz4','hz5'];
  var names = ['Z1 Erholung','Z2 Ausdauer','Z3 Tempo','Z4 Schwelle','Z5 Max'];
  var html = '';
  for(var i=0; i<zones.length; i++) {
    var lo = Math.round(hmax * zones[i][0]);
    var hi = i===4 ? hmax : Math.round(hmax * zones[i][1]) - 1;
    html += '<div class="' + cls[i] + '"><div class="hn">' + names[i] + '</div><div class="hr2">' + lo + '-' + hi + '</div></div>';
  }
  grid.innerHTML = html;
}

function renderStats() {
  var kw = getCurrentKw();

  // ---- merge Historie + Plan logs ----
  var totalKm = 0;
  var paceSecs = [];
  var hrVals = [];
  var totalRuns = 0;

  // from Historie
  for(var i=0; i<HISTORY.length; i++) {
    totalKm += HISTORY[i].dist || 0;
    totalRuns++;
    if(HISTORY[i].pace) { var s = paceToSecs(HISTORY[i].pace); if(s>0) paceSecs.push(s); }
    if(HISTORY[i].hr) hrVals.push(parseInt(HISTORY[i].hr));
  }

  // from Plan logs (only runs with dist entered, avoid double-counting Historie)
  for(var i=0; i<PLAN.length; i++) {
    for(var j=0; j<PLAN[i].workouts.length; j++) {
      var pw = PLAN[i].workouts[j];
      if(pw.type === 'gym') continue;
      var plg = logs[pw.id];
      if(!plg || !plg.dist) continue;
      totalKm += parseFloat(plg.dist) || 0;
      totalRuns++;
      if(plg.pace) { var ps = paceToSecs(plg.pace); if(ps>0) paceSecs.push(ps); }
      if(plg.hr) hrVals.push(parseInt(plg.hr));
    }
  }

  var avgPaceSec = paceSecs.length ? Math.round(paceSecs.reduce(function(a,b){return a+b;},0)/paceSecs.length) : 0;
  var avgHr = hrVals.length ? Math.round(hrVals.reduce(function(a,b){return a+b;},0)/hrVals.length) : 0;

  var h = '<div class="sg">'
    + '<div class="sc"><div class="sl">Laeufe gesamt</div><div class="sv">' + totalRuns + '</div><div class="ss">seit Jan 2026</div></div>'
    + '<div class="sc"><div class="sl">Kilometer gesamt</div><div class="sv">' + totalKm.toFixed(0) + '</div><div class="ss">km</div></div>'
    + '<div class="sc"><div class="sl">Ø Pace</div><div class="sv">' + (avgPaceSec ? fmtPace(avgPaceSec) : '-') + '</div><div class="ss">min/km</div></div>'
    + '<div class="sc"><div class="sl">Ø Puls</div><div class="sv">' + (avgHr ? avgHr + ' bpm' : '-') + '</div><div class="ss">' + (hrVals.length ? hrVals.length + ' Laeufe' : 'keine Daten') + '</div></div>'
    + '</div>';

  // ---- form trend (merged) ----
  var recentPaces = [];
  var sorted4trend = HISTORY.slice();
  sorted4trend.sort(function(a,b){
    var pa = a.date.split('.').reverse().join('');
    var pb = b.date.split('.').reverse().join('');
    return pa > pb ? 1 : -1;
  });
  for(var i=0; i<sorted4trend.length; i++) {
    if(sorted4trend[i].pace && sorted4trend[i].type !== 'gym') {
      recentPaces.push(paceToSecs(sorted4trend[i].pace));
    }
  }
  // also add plan paces to trend
  for(var i=0; i<PLAN.length; i++) {
    for(var j=0; j<PLAN[i].workouts.length; j++) {
      var tw = PLAN[i].workouts[j];
      if(tw.type === 'gym') continue;
      var tlg = logs[tw.id];
      if(tlg && tlg.pace) recentPaces.push(paceToSecs(tlg.pace));
    }
  }
  if(recentPaces.length >= 4) {
    var half = Math.floor(recentPaces.length / 2);
    var older = recentPaces.slice(0, half);
    var newer = recentPaces.slice(-half);
    var avgOld = Math.round(older.reduce(function(a,b){return a+b;},0)/older.length);
    var avgNew = Math.round(newer.reduce(function(a,b){return a+b;},0)/newer.length);
    var diff2 = avgOld - avgNew; // positive = faster (lower pace = better)
    var trendColor, trendIcon, trendText;
    if(diff2 > 5) {
      trendColor = 'var(--green-text)'; trendIcon = '&#9650;';
      trendText = fmtPace(Math.abs(diff2)) + ' min/km schneller als fruehers';
    } else if(diff2 < -5) {
      trendColor = 'var(--red-text)'; trendIcon = '&#9660;';
      trendText = fmtPace(Math.abs(diff2)) + ' min/km langsamer als fruehers';
    } else {
      trendColor = 'var(--amber-text)'; trendIcon = '&#9644;';
      trendText = 'Pace stabil';
    }
    h += '<div class="card" style="margin-bottom:10px;"><div class="cb" style="padding:12px 14px;">'
      + '<div style="display:flex;align-items:center;gap:10px;">'
      + '<span style="font-size:26px;color:' + trendColor + ';">' + trendIcon + '</span>'
      + '<div>'
      + '<div style="font-size:13px;font-weight:500;color:' + trendColor + ';">Form-Trend: ' + trendText + '</div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:2px;">Ø letzte Haelfte: ' + fmtPace(avgNew) + ' &middot; Ø erste Haelfte: ' + fmtPace(avgOld) + '</div>'
      + '</div></div>'
      + '</div></div>';
  }

  // ---- weekly km chart from HISTORY + Plan logs ----
  var weekMap = {};

  function addToWeekMap(dateStr, km) {
    var parts2 = dateStr.split('.');
    if(parts2.length < 3) return;
    var diff = getWeekOffset(dateStr);
    if(diff < 0) return;
    var wk = 'W' + diff;
    var lbl = parts2[0] + '.' + parts2[1];
    if(!weekMap[wk]) weekMap[wk] = {km:0, lbl:lbl, sort:diff};
    weekMap[wk].km += km;
  }

  // from Historie
  for(var i=0; i<HISTORY.length; i++) {
    addToWeekMap(HISTORY[i].date, HISTORY[i].dist || 0);
  }

  // from Plan logs
  for(var i=0; i<PLAN.length; i++) {
    for(var j=0; j<PLAN[i].workouts.length; j++) {
      var cw = PLAN[i].workouts[j];
      if(cw.type === 'gym') continue;
      var clg = logs[cw.id];
      if(!clg || !clg.dist) continue;
      // derive date from plan datum (Monday of that week) + offset
      var planDate = PLAN[i].datum + '2026';
      addToWeekMap(planDate, parseFloat(clg.dist) || 0);
    }
  }
  var weeks = [];
  for(var k in weekMap) weeks.push(weekMap[k]);
  weeks.sort(function(a,b){ return a.sort - b.sort; });
  var maxWkKm = 0;
  for(var i=0; i<weeks.length; i++) if(weeks[i].km > maxWkKm) maxWkKm = weeks[i].km;

  h += '<div class="stl">Wochenkilometer</div>'
    + '<div class="card"><div class="cb" style="padding:12px 14px;">';
  if(weeks.length === 0) {
    h += '<div class="empty">Noch keine Daten</div>';
  } else {
    var recentWks = weeks.slice(-12);
    h += '<div class="cw" style="height:90px;align-items:flex-end;">';
    for(var i=0; i<recentWks.length; i++) {
      var w = recentWks[i];
      var barH = maxWkKm > 0 ? Math.max(3, Math.round(w.km/maxWkKm*72)) : 3;
      var col = w.km >= 40 ? '#1D9E75' : w.km >= 25 ? '#378ADD' : '#B5D4F4';
      h += '<div class="bc2" style="position:relative;">'
        + '<div style="font-size:9px;color:var(--text2);text-align:center;margin-bottom:2px;">' + w.km.toFixed(0) + '</div>'
        + '<div class="bf" style="height:' + barH + 'px;background:' + col + ';"></div>'
        + '<div class="bl">' + w.lbl + '</div>'
        + '</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  // ---- plan completion per phase ----
  var perPhase = [0,0,0,0,0];
  var donePerPhase = [0,0,0,0,0];
  for(var i=0; i<PLAN.length; i++) {
    if(ausfallWeeks[PLAN[i].kw]) continue;
    perPhase[PLAN[i].phase] += PLAN[i].workouts.length;
    donePerPhase[PLAN[i].phase] += doneCount(PLAN[i]);
  }

  var recent = [];
  for(var i=0; i<PLAN.length; i++) { if(PLAN[i].kw <= kw) recent.push(PLAN[i]); }
  if(recent.length > 10) recent = recent.slice(-10);

  h += '<div class="stl">Trainingsplan - Abschlussrate</div>'
    + '<div class="card"><div class="cb" style="padding:12px 14px;"><div class="cw">';
  if(recent.length === 0) {
    h += '</div><div class="empty">Noch keine Daten</div>';
  } else {
    for(var i=0; i<recent.length; i++) {
      var w2 = recent[i];
      var d = doneCount(w2), tot = w2.workouts.length;
      var pct = tot ? Math.round(d/tot*100) : 0;
      var barH = Math.max(2, Math.round(pct*72/100));
      var col = ausfallWeeks[w2.kw] ? '#BA7517' : pct===100 ? '#639922' : pct>0 ? '#378ADD' : '#D3D1C7';
      h += '<div class="bc2"><div class="bf" style="height:' + barH + 'px;background:' + col + ';"></div><div class="bl">KW' + w2.kw + '</div></div>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  h += '<div class="stl">Fortschritt nach Phase</div><div class="card"><div class="cb" style="padding:12px 14px;">';
  var phaseNames = ['','Basis (KW 1-6)','Aufbau (KW 7-13)','Peak (KW 14-20)','Tapering (KW 21-25)'];
  for(var i=1; i<=4; i++) {
    var pct2 = perPhase[i] ? Math.round(donePerPhase[i]/perPhase[i]*100) : 0;
    h += '<div style="margin-bottom:12px;">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">'
      + '<span style="font-size:13px;">' + phaseNames[i] + '</span>'
      + '<span style="font-size:12px;color:var(--text2);">' + donePerPhase[i] + '/' + perPhase[i] + ' &middot; ' + pct2 + '%</span>'
      + '</div>'
      + '<div class="pb"><div class="pf" style="width:' + pct2 + '%"></div></div>'
      + '</div>';
  }
  h += '</div></div>';

  var loggedRuns = [];
  for(var i=0; i<PLAN.length; i++) {
    for(var j=0; j<PLAN[i].workouts.length; j++) {
      var w3 = PLAN[i].workouts[j];
      if(w3.type !== 'gym' && logs[w3.id] && (logs[w3.id].note || logs[w3.id].pace || logs[w3.id].dist)) {
        loggedRuns.push(w3);
      }
    }
  }
  loggedRuns = loggedRuns.slice(-6);
  h += '<div class="stl">Letzte Eintraege (Plan)</div>';
  if(loggedRuns.length === 0) {
    h += '<div class="empty">Nach jedem Lauf Pace, Puls & Gefuehl eintragen.</div>';
  } else {
    h += '<div class="card"><div class="cb" style="padding:0 14px;">';
    for(var i=0; i<loggedRuns.length; i++) {
      var lg = logs[loggedRuns[i].id];
      var parts3 = [];
      if(lg.dist) parts3.push(lg.dist + ' km');
      if(lg.pace) parts3.push(lg.pace + '/km');
      if(lg.hr) parts3.push('Puls ' + lg.hr);
      if(lg.feel) parts3.push(lg.feel);
      h += '<div class="mr"><div style="flex:1;">'
        + '<div style="font-size:13px;font-weight:500;">' + loggedRuns[i].name + '</div>'
        + '<div style="font-size:12px;color:var(--text2);">' + parts3.join(' &middot; ') + '</div>'
        + (lg.note ? '<div style="font-size:12px;color:var(--text3);">' + lg.note + '</div>' : '')
        + '</div></div>';
    }
    h += '</div></div>';
  }

  // Export
  h += '<div class="stl">Daten exportieren</div>'
    + '<div class="card"><div class="cb" style="padding:12px 14px;">'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:10px;">Alle Trainingsdaten kopieren und in Claude einfuegen zur Auswertung.</div>'
    + '<button class="bs" style="width:100%;padding:10px;font-size:14px;" onclick="exportData()">Daten kopieren</button>'
    + '<div id="export-ok" style="display:none;margin-top:8px;font-size:13px;color:var(--green-text);text-align:center;">Kopiert! Jetzt in Claude einfuegen.</div>'
    + '</div></div>';

  document.getElementById('s-stats').innerHTML = h;
}

function exportData() {
  var kw = getCurrentKw();
  var totalDone = 0, totalAll = 0;
  for(var i=0; i<PLAN.length; i++) { totalAll += PLAN[i].workouts.length; totalDone += doneCount(PLAN[i]); }
  var lines = ['=== Berlin Marathon Trainingsdaten ===', 'Stand: KW ' + kw + '/25 | ' + totalDone + '/' + totalAll + ' Einheiten', ''];
  for(var i=0; i<PLAN.length; i++) {
    var week = PLAN[i];
    if(week.kw > kw) continue;
    var done = doneCount(week);
    var ausfall = ausfallWeeks[week.kw] ? ' [' + ausfallWeeks[week.kw] + ']' : '';
    lines.push('--- KW ' + week.kw + ' (' + week.datum + ') [' + phaseName(week.phase) + '] ' + done + '/' + week.workouts.length + ausfall + ' ---');
    for(var j=0; j<week.workouts.length; j++) {
      var w = week.workouts[j];
      var isDone = !!state[w.id];
      var lg = logs[w.id] || {};
      var hasLog = lg.dist || lg.pace || lg.hr || lg.note;
      if(!isDone && !hasLog) continue;
      var line = '  ' + (isDone ? 'OK' : 'o ') + ' ' + w.name;
      var parts = [];
      if(lg.dist) parts.push(lg.dist + ' km');
      if(lg.pace) parts.push(lg.pace + '/km');
      if(lg.hr) parts.push('Puls ' + lg.hr);
      if(lg.hrmax) parts.push('Max ' + lg.hrmax);
      if(lg.feel) parts.push(lg.feel);
      if(lg.note) parts.push(lg.note);
      if(parts.length) line += ' -> ' + parts.join(', ');
      lines.push(line);
    }
    lines.push('');
  }
  var text = lines.join('\n');
  navigator.clipboard.writeText(text).then(function() {
    var el = document.getElementById('export-ok');
    if(el) { el.style.display = 'block'; setTimeout(function(){ el.style.display='none'; }, 3000); }
  }).catch(function() {
    prompt('Alles markieren und kopieren:', text);
  });
}

function loadHistorie() {
  try {
    var saved = JSON.parse(localStorage.getItem('bm-historie') || 'null');
    if(saved) HISTORY = saved;
  } catch(e) {}
}
function saveHistorie() {
  localStorage.setItem('bm-historie', JSON.stringify(HISTORY));
}

function paceToSecs(pace) {
  var parts = pace.split(':');
  if(parts.length < 2) return 0;
  return parseInt(parts[0]||0)*60 + parseInt(parts[1]||0);
}

function addHistoryEntry() {
  var date = document.getElementById('h-date').value;
  var dist = parseFloat(document.getElementById('h-dist').value);
  var pace = document.getElementById('h-pace').value;
  var hr   = document.getElementById('h-hr').value;
  var note = document.getElementById('h-note').value;
  if(!date || !dist) return;
  // convert date from YYYY-MM-DD to DD.MM.YYYY
  var parts = date.split('-');
  var fmtDate = parts[2] + '.' + parts[1] + '.' + parts[0];
  HISTORY.push({date: fmtDate, name:'Lauf', dist:dist, pace:pace, hr:hr, note:note});
  // sort by date
  HISTORY.sort(function(a,b) {
    var pa = a.date.split('.').reverse().join('');
    var pb = b.date.split('.').reverse().join('');
    return pa > pb ? 1 : -1;
  });
  saveHistorie();
  renderHistorie();
  renderStats();
}

function saveHistoryHr(idx, inputId) {
  var el = document.getElementById(inputId);
  if(!el) return;
  HISTORY[idx].hr = el.value;
  saveHistorie();
  renderHistorie();
  renderStats();
}

function deleteHistoryEntry(idx) {
  HISTORY.splice(idx, 1);
  saveHistorie();
  renderHistorie();
  renderStats();
}

function getWeekOffset(dateStr) {
  var parts = dateStr.split('.');
  if(parts.length < 3) return -1;
  var d = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  // Shift so Monday = day 0 (JS: Sun=0,Mon=1..Sat=6 -> Mon=0..Sun=6)
  var day = (d.getDay() + 6) % 7;
  var monday = new Date(d);
  monday.setDate(d.getDate() - day);
  var start = new Date('2025-12-29'); // Monday before 2026-01-01
  return Math.floor((monday - start) / (7*24*3600*1000));
}

      + '</div>'

  }
  h += '</div></div>';

}

function toggleWeek(kw) {
  openWeeks[kw] = !openWeeks[kw];
  renderPlan();

  if(currentScreen === 'heute') renderHeute();
  else if(currentScreen === 'plan') renderPlan();
  else if(currentScreen === 'puls') renderPuls();
  else if(currentScreen === 'stats') renderStats();
  else if(currentScreen === 'historie') renderHistorie();
}

function nav(name, btn) {
  currentScreen = name;
  var screens = document.querySelectorAll('.screen');
  for(var i=0; i<screens.length; i++) screens[i].classList.remove('active');
  var btns = document.querySelectorAll('.nb');
  for(var i=0; i<btns.length; i++) btns[i].classList.remove('active');
  document.getElementById('s-' + name).classList.add('active');
  btn.classList.add('active');
  render();
}
